<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defensor AVL: Sobrecarga de Energia</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 15px 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-blue);
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        #game-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            border-bottom: 2px solid #334155;
        }

        #hud {
            width: 100%;
            background-color: var(--panel-bg);
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 1rem;
            width: 80px;
            text-align: center;
            outline: none;
        }

        input:focus { border-color: var(--accent-blue); }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            color: white;
        }

        .btn-insert { background-color: var(--accent-blue); box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
        .btn-insert:hover { background-color: #2563eb; transform: scale(1.05); }

        .btn-rotate { background-color: var(--accent-green); opacity: 0.5; pointer-events: none; }
        .btn-rotate.active { 
            opacity: 1; 
            pointer-events: auto; 
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
            animation: pulse 1.5s infinite;
        }
        .btn-rotate.active:hover { background-color: #059669; transform: scale(1.05); }

        #status-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-family: monospace;
            font-size: 1.1rem;
        }

        .status-safe { color: var(--accent-green); }
        .status-danger { color: var(--accent-red); font-weight: bold; animation: blink 1s infinite; }

        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        #overlay h2 { font-size: 3rem; color: var(--accent-red); margin: 0 0 20px 0; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <header>
        <h1>Defensor AVL</h1>
    </header>

    <div id="game-container">
        <canvas id="gameCanvas" width="1000" height="600"></canvas>
        <div id="status-panel">Status: <span id="status-text" class="status-safe">ESTÁVEL</span></div>
        
        <div id="overlay">
            <h2>GAME OVER</h2>
            <p>A árvore degenerou. Sobrecarga algorítmica atingida.</p>
            <button class="btn-insert" onclick="location.reload()" style="margin-top:20px;">Reiniciar Sistema</button>
        </div>
    </div>

    <div id="hud">
        <div class="control-group">
            <input type="number" id="nodeValue" placeholder="Valor" />
            <button class="btn-insert" id="btnInsert">Inserir Energia</button>
        </div>
        <div class="control-group">
            <button class="btn-rotate" id="btnRotLeft">Rotação Esquerda</button>
            <button class="btn-rotate" id="btnRotRight">Rotação Direita</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const inputVal = document.getElementById('nodeValue');
        const btnInsert = document.getElementById('btnInsert');
        const btnRotLeft = document.getElementById('btnRotLeft');
        const btnRotRight = document.getElementById('btnRotRight');
        const statusText = document.getElementById('status-text');
        const overlay = document.getElementById('overlay');

        // Configurações de Design
        const NODE_RADIUS = 20;
        const LEVEL_HEIGHT = 70;
        const MAX_SAFE_LEVELS = 6;

        class Node {
            constructor(key) {
                this.key = key;
                this.left = null;
                this.right = null;
                this.height = 1;
                this.x = 0;
                this.y = 0;
                this.isCritical = false;
            }
        }

        class GameAVLTree {
            constructor() {
                this.root = null;
                this.gameState = 'PLAYING'; // PLAYING, WAITING_ROTATION, GAMEOVER
                this.criticalNode = null;
            }

            getHeight(node) {
                return node ? node.height : 0;
            }

            getBalance(node) {
                return node ? this.getHeight(node.left) - this.getHeight(node.right) : 0;
            }

            updateHeight(node) {
                if (node) {
                    node.height = 1 + Math.max(this.getHeight(node.left), this.getHeight(node.right));
                }
            }

            // Inserção Manual (Para o jogo, não faz rotação automática)
            insert(key) {
                if (this.gameState !== 'PLAYING') return;

                const insertNode = (node, key) => {
                    if (!node) return new Node(key);
                    if (key < node.key) node.left = insertNode(node.left, key);
                    else if (key > node.key) node.right = insertNode(node.right, key);
                    else return node; // Duplicatas ignoradas

                    this.updateHeight(node);
                    return node;
                };

                this.root = insertNode(this.root, key);
                this.checkTreeHealth(this.root);
                drawTree();
            }

            // Verifica de baixo para cima o primeiro nó desbalanceado
            checkTreeHealth(node) {
                if (!node || this.gameState !== 'PLAYING') return;
                
                this.checkTreeHealth(node.left);
                this.checkTreeHealth(node.right);

                if (this.gameState === 'PLAYING') {
                    let balance = this.getBalance(node);
                    if (balance > 1 || balance < -1) {
                        this.gameState = 'WAITING_ROTATION';
                        this.criticalNode = node;
                        node.isCritical = true;
                        
                        // Atualiza UI
                        statusText.textContent = `SOBRECARGA NO NÓ ${node.key}!`;
                        statusText.className = 'status-danger';
                        btnRotLeft.classList.add('active');
                        btnRotRight.classList.add('active');
                        btnInsert.style.opacity = '0.5';
                        btnInsert.style.pointerEvents = 'none';
                    }
                }
            }

            // Rotações
            rightRotate(y) {
                let x = y.left;
                let T2 = x.right;
                x.right = y;
                y.left = T2;
                this.updateHeight(y);
                this.updateHeight(x);
                return x;
            }

            leftRotate(x) {
                let y = x.right;
                let T2 = y.left;
                y.left = x;
                x.right = y;
                this.updateHeight(x);
                this.updateHeight(y);
                return y;
            }

            // Ação do jogador
            applyPlayerRotation(direction) {
                if (this.gameState !== 'WAITING_ROTATION' || !this.criticalNode) return;

                let balance = this.getBalance(this.criticalNode);
                let success = false;

                // Lógica simplificada de acerto do jogador
                if (direction === 'RIGHT' && balance > 1) {
                    success = true; // Necessita rotação à direita (LL ou LR)
                    // Num jogo real completo, teríamos que checar se precisa de rotação dupla
                } else if (direction === 'LEFT' && balance < -1) {
                    success = true; // Necessita rotação à esquerda (RR ou RL)
                }

                if (success) {
                    // Simula a correção substituindo na árvore (versão simplificada para visualização)
                    this.root = this.fixNode(this.root, this.criticalNode.key, direction);
                    this.criticalNode.isCritical = false;
                    this.criticalNode = null;
                    this.gameState = 'PLAYING';
                    
                    // Restaura UI
                    statusText.textContent = 'ESTÁVEL';
                    statusText.className = 'status-safe';
                    btnRotLeft.classList.remove('active');
                    btnRotRight.classList.remove('active');
                    btnInsert.style.opacity = '1';
                    btnInsert.style.pointerEvents = 'auto';
                    
                    drawTree();
                } else {
                    this.triggerGameOver();
                }
            }

            fixNode(node, key, dir) {
                if (!node) return null;
                if (key < node.key) {
                    node.left = this.fixNode(node.left, key, dir);
                } else if (key > node.key) {
                    node.right = this.fixNode(node.right, key, dir);
                } else {
                    if (dir === 'RIGHT') return this.rightRotate(node);
                    if (dir === 'LEFT') return this.leftRotate(node);
                }
                this.updateHeight(node);
                return node;
            }

            triggerGameOver() {
                this.gameState = 'GAMEOVER';
                overlay.style.display = 'flex';
            }
        }

        const tree = new GameAVLTree();

        function calculatePositions(node, x, y, offset) {
            if (!node) return;
            node.x = x;
            node.y = y;
            
            // Se a árvore cresceu demais, Game Over
            if (y > LEVEL_HEIGHT * MAX_SAFE_LEVELS) {
                tree.triggerGameOver();
            }

            if (node.left) calculatePositions(node.left, x - offset, y + LEVEL_HEIGHT, offset / 2);
            if (node.right) calculatePositions(node.right, x + offset, y + LEVEL_HEIGHT, offset / 2);
        }

        function drawLines(node) {
            if (!node) return;
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;

            if (node.left) {
                ctx.beginPath();
                ctx.moveTo(node.x, node.y);
                ctx.lineTo(node.left.x, node.left.y);
                ctx.stroke();
                drawLines(node.left);
            }
            if (node.right) {
                ctx.beginPath();
                ctx.moveTo(node.x, node.y);
                ctx.lineTo(node.right.x, node.right.y);
                ctx.stroke();
                drawLines(node.right);
            }
        }

        function drawNodes(node) {
            if (!node) return;

            // Desenha o brilho (Glow)
            ctx.beginPath();
            ctx.arc(node.x, node.y, NODE_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#1e293b';
            ctx.fill();
            
            ctx.lineWidth = 3;
            if (node.isCritical) {
                ctx.strokeStyle = '#ef4444'; // Vermelho
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 20;
            } else {
                ctx.strokeStyle = '#10b981'; // Verde
                ctx.shadowColor = '#10b981';
                ctx.shadowBlur = 15;
            }
            
            ctx.stroke();
            ctx.shadowBlur = 0; // Reseta shadow para o texto

            // Texto do nó
            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 16px Courier';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(node.key, node.x, node.y);

            drawNodes(node.left);
            drawNodes(node.right);
        }

        function drawCeiling() {
            const ceilingY = LEVEL_HEIGHT * MAX_SAFE_LEVELS + NODE_RADIUS;
            ctx.beginPath();
            ctx.moveTo(0, ceilingY);
            ctx.lineTo(canvas.width, ceilingY);
            ctx.strokeStyle = "rgba(239, 68, 68, 0.5)"; // Vermelho translúcido
            ctx.setLineDash([10, 10]);
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]); // Reseta

            ctx.fillStyle = "rgba(239, 68, 68, 0.7)";
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText("TETO DA ARENA - RISCO DE COLAPSO", 10, ceilingY - 10);
        }

        function drawTree() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawCeiling();
            
            if (tree.root) {
                // Calcula as posições X e Y antes de desenhar
                calculatePositions(tree.root, canvas.width / 2, 50, canvas.width / 4);
                drawLines(tree.root);
                drawNodes(tree.root);
            }
        }

        // Controles e Eventos
        btnInsert.addEventListener('click', () => {
            const val = parseInt(inputVal.value);
            if (!isNaN(val)) {
                tree.insert(val);
                inputVal.value = '';
                inputVal.focus();
            }
        });

        inputVal.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btnInsert.click();
        });

        btnRotLeft.addEventListener('click', () => tree.applyPlayerRotation('LEFT'));
        btnRotRight.addEventListener('click', () => tree.applyPlayerRotation('RIGHT'));

        // Init
        drawTree();
    </script>
</body>
</html>
